# qlty configuration for quarterdeck.
#
# qlty does four jobs here:
#
#   1. It formats the tree. prettier is qlty's, not npm's - see below.
#   2. It runs the checks this project has no other answer for: markdownlint,
#      actionlint, yamllint, gitleaks, knip.
#   3. It measures duplication and complexity, which neither eslint nor the
#      test suite measures.
#   4. It gates. `bin/qlty-smells-gate` turns (3) into a pass or a fail, and
#      `.github/workflows/ci.yml` runs it and `qlty check` on every pull
#      request.
#
# eslint is deliberately NOT here. It comes from `package.json` and runs as
# `npm run lint`, which `pretest` chains. Two installs and two resolution paths
# answering one question is how a project ends up with contradictory advice and
# no way to say which run is authoritative.
#
# The reasoning behind every choice below is in
# `docs/decisions/2026-08-31-measuring-duplication-and-complexity.md`.
#
# Run it:
#   qlty fmt                # rewrite the tree to prettier's shape
#   qlty check --all        # the plugins, as a gate
#   bin/qlty-smells-gate    # duplication and complexity, as a gate
#   qlty metrics --all -d   # per-directory size and complexity totals
#
# Reference: https://qlty.sh/d/qlty-toml

config_version = "0"

# ---------------------------------------------------------------------------
# What qlty does not look at
# ---------------------------------------------------------------------------
#
# `exclude_patterns` is qlty's blunt instrument: a path named here is excluded
# from ALL qlty activity - the formatter, every plugin and `qlty smells` alike.
# That is why the list is two entries long. Everything else this project wants
# to say about a specific finding is said where that finding is judged, not by
# blinding the whole toolchain to the file that carries it.
#
# qlty already skips what `.gitignore` skips, so node_modules, `.next/` and
# `dist/` need no entry here.
#
# Note what is NOT here: qlty's generated default excluded `**/config/**`,
# which would have silently swallowed `src/config/` - real quarterdeck source.
# Anything added to this list must be checked against `src/` first, and must
# arrive with the reason written beside it.
exclude_patterns = [
  # Generated: Next writes `next-env.d.ts`, and `.d.ts` files carry no logic.
  "**/*.d.ts",
  # Deliberately broken source, read as TEXT by the invariant checks - the
  # checks assert the exact line each planted fault sits on. Formatting these
  # files would move those lines, and a check that stopped matching would let
  # every rule it guards rot. eslint ignores this directory for the same
  # reason (`eslint.config.mjs`), as does `tsconfig.json`.
  "tests/violations/**",
]

# `qlty smells` skips these unless asked for them with `--include-tests`.
# Behavioural tests repeat their setup on purpose; that is not a debt.
test_patterns = [
  "tests/**",
  "**/*.test.*",
]

# ---------------------------------------------------------------------------
# The formatter
# ---------------------------------------------------------------------------
#
# prettier comes from qlty and from nowhere else. There is no prettier in
# `package.json`, deliberately.
#
# The argument that keeps eslint on npm is an argument about an INCUMBENT: this
# project already had an eslint, already had `eslint.config.mjs`, and adding
# qlty's sandboxed eslint beside it would have created two answers to one
# question. prettier has no incumbent. Installing it twice - once for `npm run
# format` and once for the gate - is how we would MANUFACTURE that problem, not
# avoid it. One install, one version, and the thing that formats the tree is
# the same binary as the thing that fails the build when it is unformatted.
#
# The cost, stated plainly: a contributor's editor has no local prettier to
# point format-on-save at, and `npm test` does not check formatting. `qlty fmt`
# is the command, CI is the backstop, and neither is discoverable from
# `package.json`. That is why both are named in `AGENTS.md`.
#
# The version is pinned because an unpinned formatter is a tree that reformats
# itself the day upstream changes a default, in a diff nobody asked for and on
# a branch that was about something else.
[[plugin]]
name = "prettier"
version = "3.6.2"

# `fixtures/all-dark/` and `fixtures/malformed/` hold snapshots truncated
# mid-token on purpose: they are what the panel reads when a fleet writes a
# file it did not finish writing, and `tests/degradation.test.ts` and
# `tests/document.test.ts` depend on them staying unparseable. prettier cannot
# parse them either - it exits 2 for the whole run - so it is told not to try.
# Scoped to prettier so gitleaks still reads them.
[[exclude]]
plugins = ["prettier"]
file_patterns = [
  "fixtures/all-dark/snapshot.json",
  "fixtures/malformed/snapshot.json",
]

# `.agents/skills/` is installed by the shadcn CLI and its integrity is pinned
# per skill in `skills-lock.json`. Unlike `src/ui/components/grok/`, which this
# project vendored and then edited, these files are carried exactly as upstream
# published them: formatting or linting them puts the tree at odds with the
# tool that writes it, and the next `skills` sync silently reverts the work.
# The first prettier pass did rewrite eighteen of them before this entry
# existed; that was undone.
#
# Scoped to the three plugins that would rewrite or judge prose we did not
# write. gitleaks still reads the directory, which is the point of gitleaks.
[[exclude]]
plugins = ["prettier", "markdownlint", "yamllint"]
file_patterns = [".agents/**"]

# ---------------------------------------------------------------------------
# The checks
# ---------------------------------------------------------------------------
#
# Each of these answers a question nothing else in this project answers. None
# of them repeats eslint, the invariant checks or the test suite.

# 70 tracked `.md` files - the architecture, the contract, the principles and
# one dated record per settled decision - and until now nothing read any of
# them. Configured in `.markdownlint.yaml` at the repository root, where the one
# retuned rule carries its reason.
[[plugin]]
name = "markdownlint"

# Two places markdownlint is right about markdown and wrong about this
# repository.
#
# `fixtures/homes/*/data/backlog.md` is not documentation. It is a synthetic
# fleet home's queue file, written in the shape a real one is written in -
# which is to say by a person typing a line per item, not wrapped to 80. The
# panel reads these as data and `tests/document.test.ts` walks them; their line
# shape is part of what they simulate. Ten MD013 findings, all of them the tool
# grading a fixture as prose.
#
# `CLAUDE.md` is a three-line pointer stub whose shape Claude Code dictates: an
# HTML comment and an `@AGENTS.md` import, with no heading anywhere. MD041
# wants a top-level heading on line 1 and there is nowhere to put one that
# would not be noise in a file nobody reads as a document.
[[exclude]]
plugins = ["markdownlint"]
file_patterns = ["fixtures/**", "CLAUDE.md"]

# One workflow, and it is now the thing that gates every pull request. A typo
# in a `runs-on` or a shell quoting mistake in the gate step fails the gate
# open, which is the one failure mode a gate cannot have.
[[plugin]]
name = "actionlint"

# actionlint reads the workflow as a workflow; yamllint reads it as YAML.
# Configured in `.yamllint.yaml` at the repository root.
[[plugin]]
name = "yamllint"

# This repository is public. `npm test` already greps every tracked file for
# machine paths and task identifiers - the "Nothing real in the repository"
# principle - but that check knows this project's own leak shapes and nothing
# about an AWS key or a GitHub token. It is a different question, and gitleaks
# is the only thing here that asks it.
[[plugin]]
name = "gitleaks"

# Dead exports and unused dependencies. Nothing else looks: eslint sees one
# file at a time and cannot know an export has no importer, and the test suite
# exercises what is reachable rather than reporting what is not. Configured in
# `knip.json`.
[[plugin]]
name = "knip"

# osv-scanner is deliberately absent, and it is the one plugin whose absence is
# a gap rather than a preference. It reaches the network on every run, and a
# local `qlty check` that stalls offline is a tool people stop running.
# `[[plugin]] triggers` cannot fix that here - see the decision record for what
# was measured - so it runs as its own CI step in `ci.yml` instead, where the
# network is a given. Do not add a `[[plugin]]` entry for it.

# ---------------------------------------------------------------------------
# The measurements
# ---------------------------------------------------------------------------
#
# Every smell qlty can find, with its threshold written out rather than left
# implicit, so the next contributor can see what is measured and at what number
# it fires. These are qlty's own CLI defaults with one exception,
# `return_statements`, which is raised by one and says below what it was
# measured against. Nothing else has been loosened.
#
# What is measured here is NOT gated by `qlty check`: smells do not participate
# in the linter pipeline, and `qlty smells` exits 0 whether it finds twelve
# problems or none. `bin/qlty-smells-gate` is what turns these numbers into a
# verdict, and the findings this project has looked at and decided to keep are
# listed there, each with its reason.
[smells]

# Duplication: `identical_code` is copy-paste, `similar_code` is the same shape
# with the names changed. The threshold is a mass of syntax nodes, not a line
# count.
[smells.identical_code]
enabled = true
threshold = 15

[smells.similar_code]
enabled = true
threshold = 15

[smells.duplication]
nodes_threshold = 64

# Complexity: `file_complexity` catches a file that has grown past what one
# reader holds; `function_complexity` catches the one function inside it that
# did the growing.
[smells.file_complexity]
enabled = true
threshold = 50

[smells.function_complexity]
enabled = true
threshold = 18

# The shapes that make a function hard to follow, each measured on its own.
[smells.boolean_logic]
enabled = true
threshold = 4

[smells.nested_control_flow]
enabled = true
threshold = 5

[smells.function_parameters]
enabled = true
threshold = 6

# Raised from qlty's default of 6, deliberately and by one.
#
# A smell fires at the threshold, not past it, so 6 flagged every function with
# exactly six returns - and in this codebase that is the shape of a validator,
# not the shape of a problem. Measured against these six:
#
#   `keyedAnswerLine` and `submitIntent`  src/adapters/intent.ts
#   `read`                                src/adapters/terminal.ts
#   `recheck`                             src/app/api/act/[...intent]/route.ts
#   `ago`                                 src/ui/lib/age.ts
#   `AnswerControl`                       src/ui/needs-you/answer-control.tsx
#
# Four of them are refusal ladders: one early return per distinct reason to
# refuse, each carrying the sentence an operator reads. `ago` is a ladder of
# units. Nesting any of them to reach five returns would hide which refusal a
# reader is looking at, which is the one thing these functions exist to make
# obvious. Seven is the smallest number that clears the six and still fires on
# a seventh branch nobody planned.
[smells.return_statements]
enabled = true
threshold = 7

[[source]]
name = "default"
default = true
